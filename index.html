    .menu-container { position: relative; display: inline-block; }

    .history-item { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; border-bottom: 1px solid #1e293b; font-size: 10px; }

    .withdraw-detail { font-size: 10px; color: #94a3b8; line-height: 1.6; }
    .withdraw-detail span { color: #f8fafc; font-weight: 500; }

<body>

<div class="app" id="app">

  <!-- LOGIN SCREEN -->
  <div id="loginScreen" class="login-screen">
    <div class="text-7xl mb-3">👑</div>

    <div class="login-box">
      <input type="password" id="adminPass" placeholder="एडमिन पासवर्ड दर्ज करें" onkeydown="if(event.key==='Enter') doLogin()">

  <!-- ADMIN PANEL -->
  <div id="adminPanel" style="display:none;flex-direction:column;height:100vh;">

      <h1>👑 एडमिन पैनल</h1>
      <div class="flex-center">
        <div class="status" id="liveStatus">
          <span class="dot offline" id="statusDot"></span>
          <span id="statusText">कनेक्ट नहीं</span>
        </div>
        <button onclick="refreshData()" class="btn-sm btn-gray" style="padding:3px 8px;">🔄</button>

      <div class="loading"><div class="spinner"></div>लोड हो रहा है...</div>

<script>
// ============================================================
// ====================== CONFIG ===============================
// ============================================================
const ADMIN_PASSWORD = "admin123";
const SESSION_KEY = 'tp_admin_session';
const defaultConfig = {
  telegramLink: "https://t.me/royalcasino",
  whatsappLink: "https://wa.me/919999999999",
  minWithdraw: 100,
  promoCodes: [],
  bankList: ["SBI", "HDFC", "ICICI", "Axis", "Other"],
  fakeOnline: 50,
  fakePlaying: 10,
  depositAmounts: [100, 200, 500, 1000],
  broadcastMsg: ""
};

// ============================================================
// ====================== STATE ================================
// ============================================================
let users = {};
let trashUsers = {};
let config = { ...defaultConfig };
let liveTables = {};
let activeTab = 'home';
let searchQuery = '';
let isSearching = false;
let isRendering = false;
let renderTimer = null;
let dataLoaded = false;
let listenersActive = false;

let userListener = null;
let trashListener = null;
let configListener = null;
let tablesListener = null;

// ============================================================
// ====================== FIREBASE =============================
// ============================================================
function initFirebase() {
  if (!window.db) {
    document.getElementById('liveStatus').innerHTML = '<span class="dot offline"></span> DB Error';
    return;
  }

  document.getElementById('liveStatus').innerHTML = '<span class="dot online" id="statusDot"></span> कनेक्टेड';
  detachListeners();

  try {
    userListener = window.db.ref('tp_users');
    userListener.on('value', (snap) => {
      users = snap.val() || {};
      dataLoaded = true;
      if (!isSearching) scheduleRender();
    });

    trashListener = window.db.ref('tp_trash');
    trashListener.on('value', (snap) => {
      trashUsers = snap.val() || {};
      if (!isSearching) scheduleRender();
    });

    configListener = window.db.ref('tp_config');
    configListener.on('value', (snap) => {
      const val = snap.val();
      if (!val) {
        config = { ...defaultConfig };
        window.db.ref('tp_config').set(config);
      } else {
        config = { ...defaultConfig, ...val };
      }
      if (!isSearching) scheduleRender();
    });

    tablesListener = window.db.ref('tp_live_tables');
    tablesListener.on('value', (snap) => {
      liveTables = snap.val() || {};
      if (!isSearching) scheduleRender();
    });

    listenersActive = true;
  } catch(e) {
    console.error("Firebase listener error:", e);
    document.getElementById('contentArea').innerHTML = '<div class="card text-red-400">Firebase Error: ' + e.message + '</div>';
  }
}

function detachListeners() {
  try {
    if (userListener) { userListener.off(); userListener = null; }
    if (trashListener) { trashListener.off(); trashListener = null; }
    if (configListener) { configListener.off(); configListener = null; }
    if (tablesListener) { tablesListener.off(); tablesListener = null; }
  } catch(e) {}
  listenersActive = false;
}

// ============================================================
// ====================== RENDER THROTTLING ===================
// ============================================================
function scheduleRender() {
  if (isSearching) return;
  if (renderTimer) { clearTimeout(renderTimer); renderTimer = null; }
  renderTimer = setTimeout(() => {
    renderTimer = null;
    safeRender();
  }, 400);
}

function safeRender() {
  if (isRendering || isSearching) return;
  renderContent();
}

// ============================================================
// ====================== LOGIN / LOGOUT =======================
// ============================================================
function checkSession() {
  if (sessionStorage.getItem(SESSION_KEY) === 'true') {
    showAdminPanel();
    return true;
  }
  return false;
}

function doLogin() {
  const pass = document.getElementById('adminPass').value;
  if (pass === ADMIN_PASSWORD) {
    sessionStorage.setItem(SESSION_KEY, 'true');
    showAdminPanel();
  } else {
    showToast('गलत पासवर्ड!', 'error');
  }
}

function doLogout() {
  if (confirm('क्या आप लॉगआउट करना चाहते हैं?')) {
    sessionStorage.removeItem(SESSION_KEY);
    document.getElementById('adminPanel').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('adminPass').value = '';
    detachListeners();
  }
}

function showAdminPanel() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('adminPanel').style.display = 'flex';
  dataLoaded = false;
  initFirebase();
  setTab('home');
}

// ============================================================
// ====================== TOAST ================================
// ============================================================
function showToast(msg, type = 'success') {
  const toast = document.getElementById('toast');
  const icon = document.getElementById('toastIcon');
  const msgEl = document.getElementById('toastMsg');
  
  const icons = {
    success: '✅',
    error: '❌',
    warning: '⚠️',
    info: 'ℹ️'
  };
  icon.textContent = icons[type] || '✅';
  msgEl.textContent = msg;
  toast.classList.remove('hidden');
  setTimeout(() => toast.classList.add('hidden'), 2500);
}

// ============================================================
// ====================== TAB MANAGEMENT =======================
// ============================================================
function setTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const navEl = document.getElementById('nav_' + tab);
  if (navEl) navEl.classList.add('active');
  
  isSearching = false;
  searchQuery = '';
  
  if (renderTimer) { clearTimeout(renderTimer); renderTimer = null; }
  renderContent();
}

function refreshData() {
  detachListeners();
  document.getElementById('contentArea').innerHTML = '<div class="loading"><div class="spinner"></div>डेटा रीफ्रेश हो रहा है...</div>';
  setTimeout(() => {
    initFirebase();
    showToast('डेटा रीफ्रेश हो गया!', 'success');
  }, 600);
}

// ============================================================
// ====================== SEARCH ===============================
// ============================================================
function startSearch() {
  isSearching = true;
}

function doSearch() {
  const el = document.getElementById('searchInput');
  if (el) {
    searchQuery = el.value.toLowerCase().trim();
    const area = document.getElementById('contentArea');
    if (area) {
      isRendering = true;
      try {
        area.innerHTML = renderUsers();
      } catch(e) {
        area.innerHTML = '<div class="card text-red-400">Error: ' + e.message + '</div>';
      }
      isRendering = false;
    }
  }
}

function exitSearch() {
  isSearching = false;
  searchQuery = '';
  const input = document.getElementById('searchInput');
  if (input) input.value = '';
  renderContent();
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && document.activeElement && document.activeElement.id === 'searchInput') {
    doSearch();
  }
  if (e.key === 'Escape' && isSearching) {
    exitSearch();
  }
});

// ============================================================
// ====================== 3 LINES MENU (≡) ====================
// ============================================================
function toggleMenu(userId, event) {
  event.stopPropagation();
  
  document.querySelectorAll('.menu-dropdown').forEach(el => {
    if (el.id !== 'menu_' + userId) {
      el.classList.remove('show');
    }
  });
  
  document.querySelectorAll('.menu-overlay').forEach(el => {
    if (el.id !== 'overlay_' + userId) {
      el.classList.remove('show');
    }
  });
  
  const menu = document.getElementById('menu_' + userId);
  const overlay = document.getElementById('overlay_' + userId);
  
  if (menu) {
    menu.classList.toggle('show');
  }
  if (overlay) {
    overlay.classList.toggle('show');
  }
}

function closeAllMenus() {
  document.querySelectorAll('.menu-dropdown').forEach(el => el.classList.remove('show'));
  document.querySelectorAll('.menu-overlay').forEach(el => el.classList.remove('show'));
}

document.addEventListener('click', function() {
  closeAllMenus();
});

// ============================================================
// ====================== DB HELPERS ===========================
// ============================================================
function saveUserToDB(id, data) {
  if (window.db) {
    window.db.ref('tp_users/' + id).update(data).catch(e => showToast('DB Error: ' + e.message, 'error'));
    if (!isSearching) scheduleRender();
  }
}

function saveConfigToDB() {
  if (window.db) {
    window.db.ref('tp_config').set(config).catch(e => showToast('Config Error: ' + e.message, 'error'));
    if (!isSearching) scheduleRender();
  }
}

function escapeHtml(text) {
  if (text === null || text === undefined) return '';
  const div = document.createElement('div');
  div.textContent = String(text);
  return div.innerHTML;
}

// ============================================================
// ====================== MAIN RENDER ==========================
// ============================================================
function renderContent() {
  if (isRendering || isSearching) return;
  isRendering = true;
  const area = document.getElementById('contentArea');
  
  try {
    if (!dataLoaded) {
      area.innerHTML = '<div class="loading"><div class="spinner"></div>डेटा लोड हो रहा है...</div>';
      isRendering = false;
      return;
    }

    switch(activeTab) {
      case 'home': area.innerHTML = renderHome(); break;
      case 'users': area.innerHTML = renderUsers(); break;
      case 'deposits': area.innerHTML = renderDeposits(); break;
      case 'withdrawals': area.innerHTML = renderWithdrawals(); break;
      case 'trash': area.innerHTML = renderTrash(); break;
      default: area.innerHTML = '<div class="card text-gray">पेज नहीं मिला</div>';
    }
  } catch(e) {
    area.innerHTML = '<div class="card text-red-400">Error: ' + escapeHtml(e.message) + '</div>';
    console.error('Render Error:', e);
  }
  isRendering = false;
}

// ============================================================
// ====================== RENDER: HOME =========================
// ============================================================
function renderHome() {
  let today = 0, online = 0, playing = 0, pending = 0, totalBalance = 0;
  const now = new Date();
  const startToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();

  Object.values(users).forEach(u => {
    if (u.createdAt && u.createdAt >= startToday) today++;
    if (u.isOnline) online++;
    if (u.isPlaying) playing++;
    totalBalance += (u.balance || 0);
    if (Array.isArray(u.withdrawHistory)) {
      pending += u.withdrawHistory.filter(tx => tx.status === 'Pending').length;
    }
  });

  let pendingHtml = '';
  Object.values(users).forEach(u => {
    (u.withdrawHistory || []).forEach(tx => {
      if (tx.status === 'Pending') {
        const bank = u.bankDetails || {};
        pendingHtml += `
          <div class="card" style="border-color:#ef4444;">
            <div class="flex-between">
              <div>
                <div class="text-sm font-bold">${escapeHtml(u.name)}</div>
                <div class="text-xs text-yellow-400">₹${tx.amount} | ${escapeHtml(u.mobile)}</div>
              </div>
              <div class="flex-center gap-1">
                <button onclick="approveWithdraw('${u.id}', ${tx.txId})" class="btn-sm btn-green">✅</button>
                <button onclick="rejectWithdraw('${u.id}', ${tx.txId})" class="btn-sm btn-red">❌</button>
              </div>
            </div>

      <div class="flex-center gap-1">

  return `

      <div class="card text-center"><div class="text-xs text-gray">ऑनलाइन</div><div class="text-2xl font-bold text-blue-400">${online + (config.fakeOnline || 0)}</div></div>

function renderUsers() {
  let userList = Object.values(users);
  
  if (searchQuery) {
    userList = userList.filter(u =>
      (u.id && u.id.toLowerCase().includes(searchQuery)) ||
      (u.name && u.name.toLowerCase().includes(searchQuery)) ||
      (u.mobile && u.mobile.includes(searchQuery))
    );
  }

  let html = `
    <div class="flex-center gap-2" style="margin-bottom:8px;">
      <input type="text" id="searchInput" value="${escapeHtml(searchQuery)}" placeholder="🔍 यूजर सर्च करें..." 
        class="search-input" style="flex:1;"
        onfocus="startSearch()" 
        oninput="doSearch()"
        onkeydown="if(event.key==='Escape') exitSearch()">
      ${searchQuery ? `<span style="cursor:pointer;font-size:11px;color:#94a3b8;" onclick="exitSearch()">✕</span>` : ''}
    </div>
    <div class="text-xs text-gray" style="margin-bottom:6px;">${searchQuery ? 'सर्च रिजल्ट: ' + userList.length + ' यूजर' : 'कुल ' + Object.values(users).length + ' यूजर्स'}</div>
  `;

  if (userList.length === 0) {
    return html + '<div class="card text-gray text-center">कोई यूजर नहीं मिला</div>';
  }

  userList.forEach(u => {
    const balance = u.balance || 0;
    const wdBalance = u.withdrawableBalance || 0;
    const hasDepositedAfter250 = u.hasDepositedAfter250 || false;
    const deviceId = u.deviceId || 'N/A';
    
    // Deposit History with delete/restore
    const depoHtml = (u.depositHistory || []).slice().reverse().map((d, idx) => {
      const isDeleted = d._deleted === true;
      const originalIdx = (u.depositHistory || []).length - 1 - idx;
      return `
        <div class="history-item ${isDeleted ? 'deleted-item' : ''}" id="dep_item_${u.id}_${originalIdx}">
          <span class="text-gray">${escapeHtml(d.time || '')}</span>
          <div class="flex-center">
            <span class="text-green">+₹${d.amount || 0}</span>
            ${!isDeleted ? `<button onclick="deleteHistoryItem('${u.id}', 'depositHistory', ${originalIdx})" class="delete-btn" title="हटाएं">✕</button>` : ''}
            ${isDeleted ? `<button onclick="restoreHistoryItem('${u.id}', 'depositHistory', ${originalIdx})" class="restore-btn" title="वापस लाएं">↩️</button>` : ''}
          </div>
        </div>
      `;
    }).join('') || '<span class="text-gray text-xs">कोई डिपॉजिट नहीं</span>';

    // Withdraw History with delete/restore
    const wdrlHtml = (u.withdrawHistory || []).slice().reverse().map((w, idx) => {
      const isDeleted = w._deleted === true;
      const originalIdx = (u.withdrawHistory || []).length - 1 - idx;
      return `
        <div class="history-item ${isDeleted ? 'deleted-item' : ''}" id="wd_item_${u.id}_${originalIdx}">
          <span class="text-gray">${escapeHtml(w.time || '')}</span>
          <div class="flex-center">
            <span class="text-red">-₹${w.amount || 0} <span class="badge badge-${w.status?.toLowerCase() || 'pending'}">${escapeHtml(w.status || 'Pending')}</span></span>
            ${!isDeleted ? `<button onclick="deleteHistoryItem('${u.id}', 'withdrawHistory', ${originalIdx})" class="delete-btn" title="हटाएं">✕</button>` : ''}
            ${isDeleted ? `<button onclick="restoreHistoryItem('${u.id}', 'withdrawHistory', ${originalIdx})" class="restore-btn" title="वापस लाएं">↩️</button>` : ''}
          </div>
        </div>
      `;
    }).join('') || '<span class="text-gray text-xs">कोई विड्रॉल नहीं</span>';

    // Game History with delete/restore
    const gameHtml = (u.gameHistory || []).slice().reverse().map((g, idx) => {
      const isDeleted = g._deleted === true;
      const originalIdx = (u.gameHistory || []).length - 1 - idx;
      return `
        <div class="history-item ${isDeleted ? 'deleted-item' : ''}" id="game_item_${u.id}_${originalIdx}">
          <span class="text-gray">${escapeHtml(g.time || '')}</span>
          <div class="flex-center">
            <span class="${g.result === 'Loss' ? 'text-red' : 'text-green'}">${escapeHtml(g.result)} ₹${g.amount}</span>
            ${!isDeleted ? `<button onclick="deleteHistoryItem('${u.id}', 'gameHistory', ${originalIdx})" class="delete-btn" title="हटाएं">✕</button>` : ''}
            ${isDeleted ? `<button onclick="restoreHistoryItem('${u.id}', 'gameHistory', ${originalIdx})" class="restore-btn" title="वापस लाएं">↩️</button>` : ''}
          </div>
        </div>
      `;
    }).join('') || '<span class="text-gray text-xs">कोई गेम नहीं</span>';

    const refHtml = `
      <div class="text-xs" style="padding:3px;background:#0f172a;border-radius:4px;margin-top:3px;">
        <span class="text-gray">कोड: </span><span class="text-yellow font-mono">${escapeHtml(u.referralCode || 'N/A')}</span>
        <span class="text-gray ml-2">कमाई: </span><span class="text-green">₹${u.referralEarnings || 0}</span>
        <span class="text-gray ml-2">रेफरल: </span><span class="text-white">${u.referralCount || 0}</span>
      </div>
    `;

    const referredUsers = Object.values(users).filter(r => r.referredBy === u.referralCode);
    const refListHtml = referredUsers.map(r => `
      <div class="flex-between text-xs" style="border-bottom:1px solid #1e293b;padding:2px 0;">
        <span>${escapeHtml(r.name)} (${escapeHtml(r.mobile)})</span>
        <span class="badge ${(r.depositHistory || []).reduce((s,d) => s + (parseInt(d.amount)||0), 0) >= 100 ? 'badge-approved' : 'badge-pending'}">
          ${(r.depositHistory || []).reduce((s,d) => s + (parseInt(d.amount)||0), 0) >= 100 ? '✅ डिपॉजिट' : '⏳ बाकी'}
        </span>
      </div>
    `).join('');

    html += `
      <div class="card">
        <!-- ===== 3 LINES MENU (≡) ON TOP ===== -->
        <div class="flex-between" style="margin-bottom:4px;">
          <div class="flex-center">
            <span class="text-sm font-bold text-yellow-400">${escapeHtml(u.name || 'Unknown')}</span>
            ${u.isBlocked ? '<span class="badge badge-blocked">ब्लॉक</span>' : '<span class="badge badge-active">सक्रिय</span>'}
          </div>
          <div class="menu-container">
            <button class="menu-dots" onclick="toggleMenu('${u.id}', event)">≡</button>
            <div class="menu-dropdown" id="menu_${u.id}">
              <div class="menu-item" onclick="viewDepositHistory('${u.id}')">
                <span class="icon">⬇️</span> डिपॉजिट हिस्ट्री देखें
              </div>
              <div class="menu-item" onclick="viewWithdrawHistory('${u.id}')">
                <span class="icon">⬆️</span> विड्रॉल हिस्ट्री देखें
              </div>
              <div class="menu-item" onclick="viewGameHistory('${u.id}')">
                <span class="icon">🎮</span> गेम हिस्ट्री देखें
              </div>
              <div class="menu-item" onclick="viewReferrals('${u.id}')">
                <span class="icon">🎁</span> रेफरल्स देखें
              </div>
              <div class="menu-item" onclick="toggleBlock('${u.id}')" style="color:${u.isBlocked ? '#22c55e' : '#f97316'};">
                <span class="icon">${u.isBlocked ? '🔓' : '🔒'}</span> ${u.isBlocked ? 'अनब्लॉक' : 'ब्लॉक'}
              </div>
              <div class="menu-item" onclick="deleteUserToTrash('${u.id}')" style="color:#ef4444;">
                <span class="icon">🗑️</span> डिब्बे में भेजें
              </div>
              <div class="menu-item" onclick="resetDepositStatus('${u.id}')" style="color:#eab308;">
                <span class="icon">🔄</span> ₹250+ Deposit रीसेट
              </div>
              <div class="menu-item" onclick="refreshUserData('${u.id}')" style="color:#3b82f6;">
                <span class="icon">🔄</span> डेटा रीफ्रेश करें
              </div>
            </div>
            <div class="menu-overlay" id="overlay_${u.id}" onclick="closeAllMenus()"></div>
          </div>
        </div>

        <div class="flex-between">
          <div>
            <div class="text-xs text-gray">${escapeHtml(u.id || 'N/A')} | ${escapeHtml(u.mobile || 'N/A')}</div>
            <div class="text-[9px] text-gray">📱 ${escapeHtml(deviceId)}</div>
            <div class="text-[9px] ${hasDepositedAfter250 ? 'text-green' : 'text-yellow'}">${hasDepositedAfter250 ? '✅ ₹250+ Deposit Done' : '⚠️ ₹250+ Deposit Pending'}</div>
          </div>
          <div class="text-right">
            <div class="text-lg font-bold text-green">₹${balance.toLocaleString('en-IN')}</div>
            <div class="text-[9px] text-yellow">विड्रॉल: ₹${Math.min(wdBalance, balance).toLocaleString('en-IN')}</div>
          </div>
        </div>

        <!-- ===== COLLAPSIBLE SECTIONS ===== -->
        <div id="depositHist_${u.id}" class="user-collapse hidden">
          <div class="card-title text-green">📥 डिपॉजिट हिस्ट्री <span class="text-xs text-gray">(हटाई गई हिस्ट्री दोबारा देखने के लिए ↩️ क्लिक करें)</span></div>
          ${depoHtml}
        </div>

        <div id="withdrawHist_${u.id}" class="user-collapse hidden">
          <div class="card-title text-red">📤 विड्रॉल हिस्ट्री <span class="text-xs text-gray">(हटाई गई हिस्ट्री दोबारा देखने के लिए ↩️ क्लिक करें)</span></div>
          ${wdrlHtml}
        </div>

        <div id="gameHist_${u.id}" class="user-collapse hidden">
          <div class="card-title text-purple-400">🎮 गेम हिस्ट्री <span class="text-xs text-gray">(हटाई गई हिस्ट्री दोबारा देखने के लिए ↩️ क्लिक करें)</span></div>
          ${gameHtml}
        </div>

        <div id="refList_${u.id}" class="user-collapse hidden">
          <div class="card-title text-purple-400">🎁 रेफरल्स</div>
          ${refListHtml || '<span class="text-gray text-xs">कोई रेफरल नहीं</span>'}
        </div>

        ${refHtml}

        <!-- ===== ADMIN CONTROLS ===== -->
        <div style="margin-top:4px;">
          <div class="flex-center gap-1" style="margin-bottom:3px;">
            <input type="number" id="amt_${u.id}" placeholder="राशि" class="input-field" style="flex:1;padding:3px 6px;font-size:10px;">
            <button onclick="adjustBalance('${u.id}', 'add')" class="btn-sm btn-green" style="font-size:9px;">+</button>
            <button onclick="adjustBalance('${u.id}', 'sub')" class="btn-sm btn-red" style="font-size:9px;">-</button>
          </div>
          <div class="flex-center gap-1">
            <input type="text" id="pass_${u.id}" value="${escapeHtml(u.password || '')}" placeholder="पासवर्ड" class="input-field" style="flex:1;padding:3px 6px;font-size:10px;">
            <button onclick="changePass('${u.id}')" class="btn-sm btn-blue" style="font-size:9px;">सेव</button>
          </div>
          <div class="flex-center gap-1" style="margin-top:3px;">
            <input type="text" id="bankName_${u.id}" value="${escapeHtml(u.bankDetails?.bankName || '')}" placeholder="बैंक" class="input-field" style="flex:1;padding:3px 6px;font-size:9px;">
            <input type="text" id="accName_${u.id}" value="${escapeHtml(u.bankDetails?.accName || '')}" placeholder="होल्डर" class="input-field" style="flex:1;padding:3px 6px;font-size:9px;">
          </div>
          <div class="flex-center gap-1" style="margin-top:2px;">
            <input type="text" id="accNum_${u.id}" value="${escapeHtml(u.bankDetails?.accNumber || '')}" placeholder="अकाउंट" class="input-field" style="flex:1;padding:3px 6px;font-size:9px;">
            <input type="text" id="ifsc_${u.id}" value="${escapeHtml(u.bankDetails?.ifsc || '')}" placeholder="IFSC" class="input-field" style="flex:1;padding:3px 6px;font-size:9px;">
            <button onclick="editBank('${u.id}')" class="btn-sm btn-blue" style="font-size:9px;">अपडेट</button>
          </div>
        </div>
      </div>
    `;
  });

  return html;

// ====================== RENDER: DEPOSITS =====================
// ============================================================
function renderDeposits() {
  let allDeposits = [];
  Object.values(users).forEach(u => {
    (u.depositHistory || []).forEach(d => {
      // Skip deleted items
      if (d._deleted) return;
      allDeposits.push({ ...d, user: u.name, mobile: u.mobile, userId: u.id });
    });
  });
  allDeposits.sort((a,b) => (b.ts || 0) - (a.ts || 0));

  if (allDeposits.length === 0) {
    return '<div class="card text-gray text-center">कोई डिपॉजिट नहीं मिला</div>';
  }

  return allDeposits.slice(0, 50).map(d => `
    <div class="card flex-between">
      <div>
        <div class="text-sm font-bold">${escapeHtml(d.user || 'N/A')}</div>
        <div class="text-xs text-gray">${escapeHtml(d.mobile || 'N/A')}</div>

// ====================== RENDER: WITHDRAWALS ==================
// ============================================================
function renderWithdrawals() {
  let allWithdrawals = [];
  Object.values(users).forEach(u => {
    (u.withdrawHistory || []).forEach(w => {
      // Skip deleted items
      if (w._deleted) return;
      allWithdrawals.push({ ...w, user: u.name, mobile: u.mobile, userId: u.id, bankDetails: u.bankDetails });
    });
  });
  allWithdrawals.sort((a,b) => (b.ts || 0) - (a.ts || 0));

  if (allWithdrawals.length === 0) {
    return '<div class="card text-gray text-center">कोई विड्रॉल नहीं मिला</div>';
  }

  return allWithdrawals.slice(0, 50).map(w => {
    const bank = w.bankDetails || {};
    const statusClass = w.status === 'Approved' ? 'badge-approved' : w.status === 'Rejected' ? 'badge-rejected' : 'badge-pending';
    return `
      <div class="card">
        <div class="flex-between">
          <div>
            <div class="text-sm font-bold text-yellow-400">${escapeHtml(w.user || 'N/A')}</div>
            <div class="text-xs text-gray">📱 ${escapeHtml(w.mobile || 'N/A')}</div>
            <div class="text-xs text-gray">₹${w.amount || 0} | ${escapeHtml(w.time || '')}</div>
          </div>
          <div class="text-right">
            <span class="badge ${statusClass}">${escapeHtml(w.status || 'Pending')}</span>
            ${w.status === 'Pending' ? `
              <div class="flex-center gap-1" style="margin-top:3px;">
                <button onclick="approveWithdraw('${w.userId}', ${w.txId})" class="btn-sm btn-green" style="font-size:9px;">✅</button>
                <button onclick="rejectWithdraw('${w.userId}', ${w.txId})" class="btn-sm btn-red" style="font-size:9px;">❌</button>
              </div>
            ` : ''}
          </div>
        </div>
        <div class="withdraw-detail" style="margin-top:4px;padding-top:4px;border-top:1px solid #334155;">
          <div>🏦 बैंक: <span>${escapeHtml(bank.bankName || 'N/A')}</span></div>
          <div>👤 होल्डर: <span>${escapeHtml(bank.accName || 'N/A')}</span></div>
          <div>🔢 अकाउंट: <span>${escapeHtml(bank.accNumber || 'N/A')}</span></div>
          <div>🏷️ IFSC: <span>${escapeHtml(bank.ifsc || 'N/A')}</span></div>
        </div>
      </div>
    `;
  }).join('');
}

// ====================== HISTORY DELETE/RESTORE ===============
// ============================================================
function deleteHistoryItem(userId, type, index) {
  if (!confirm('क्या आप यह हिस्ट्री आइटम हटाना चाहते हैं?')) return;
  
  const u = users[userId];
  if (!u) return showToast('यूजर नहीं मिला', 'error');
  
  const history = u[type] || [];
  if (index >= history.length) return showToast('आइटम नहीं मिला', 'error');
  
  // Mark as deleted (keep in array but mark)
  history[index] = { ...history[index], _deleted: true };
  
  const updates = {};
  updates[type] = history;
  
  if (window.db) {
    window.db.ref('tp_users/' + userId).update(updates)
      .then(() => {
        showToast('✅ हिस्ट्री हटा दी गई! (दोबारा देखने के लिए ↩️ क्लिक करें)', 'success');
        // Update local users
        users[userId][type] = history;
        if (!isSearching) scheduleRender();
      })
      .catch(e => showToast('Error: ' + e.message, 'error'));
  }
}

function restoreHistoryItem(userId, type, index) {
  const u = users[userId];
  if (!u) return showToast('यूजर नहीं मिला', 'error');
  
  const history = u[type] || [];
  if (index >= history.length) return showToast('आइटम नहीं मिला', 'error');
  
  // Remove _deleted flag
  if (history[index] && history[index]._deleted) {
    delete history[index]._deleted;
  }
  
  const updates = {};
  updates[type] = history;
  
  if (window.db) {
    window.db.ref('tp_users/' + userId).update(updates)
      .then(() => {
        showToast('✅ हिस्ट्री वापस आ गई!', 'success');
        users[userId][type] = history;
        if (!isSearching) scheduleRender();
      })
      .catch(e => showToast('Error: ' + e.message, 'error'));
  }
}

function adjustBalance(id, type) {
  const amt = parseInt(document.getElementById('amt_' + id).value);
  if (!amt || amt <= 0) return showToast('वैध राशि दर्ज करें', 'warning');
  const u = users[id];
  if (!u) return showToast('यूजर नहीं मिला', 'error');

  const updates = {};
  if (type === 'add') {
    updates.balance = (u.balance || 0) + amt;
    updates.withdrawableBalance = (u.withdrawableBalance || 0) + amt;
    const hist = Array.isArray(u.depositHistory) ? u.depositHistory : [];
    hist.push({ amount: amt, time: new Date().toLocaleString(), ts: Date.now(), desc: 'Admin Added' });
    updates.depositHistory = hist.slice(-30);
    saveUserToDB(id, updates);
    showToast('₹' + amt + ' जोड़े गए!', 'success');
  } else {
    updates.balance = Math.max(0, (u.balance || 0) - amt);
    updates.withdrawableBalance = Math.max(0, (u.withdrawableBalance || 0) - amt);
    const hist = Array.isArray(u.withdrawHistory) ? u.withdrawHistory : [];
    hist.push({ txId: Date.now(), amount: amt, time: new Date().toLocaleString(), ts: Date.now(), status: 'Admin Deducted' });
    updates.withdrawHistory = hist.slice(-30);
    saveUserToDB(id, updates);
    showToast('₹' + amt + ' कटे!', 'success');
  }
  document.getElementById('amt_' + id).value = '';
}

// ----- WITHDRAW -----
function approveWithdraw(userId, txId) {
  if (!confirm('विड्रॉल स्वीकृत करें?')) return;
  const u = users[userId];
  if (!u) return showToast('यूजर नहीं मिला', 'error');
  const history = u.withdrawHistory || [];
  const tx = history.find(t => t.txId === txId);
  if (!tx) return showToast('ट्रांज़ैक्शन नहीं मिला', 'error');
  tx.status = 'Approved';
  window.db.ref('tp_users/' + userId + '/withdrawHistory').set(history)
    .then(() => showToast('विड्रॉल सफल!', 'success'))
    .catch(e => showToast('Error: ' + e.message, 'error'));
}

function rejectWithdraw(userId, txId) {
  if (!confirm('विड्रॉल रिजेक्ट करें? पैसे वापस होंगे।')) return;
  const u = users[userId];
  if (!u) return showToast('यूजर नहीं मिला', 'error');
  const history = u.withdrawHistory || [];
  const tx = history.find(t => t.txId === txId);
  if (!tx) return showToast('ट्रांज़ैक्शन नहीं मिला', 'error');
  tx.status = 'Rejected';
  const newBalance = (u.balance || 0) + tx.amount;
  const newWd = (u.withdrawableBalance || 0) + tx.amount;
  window.db.ref('tp_users/' + userId).update({
    withdrawHistory: history,
    balance: newBalance,
    withdrawableBalance: newWd
  }).then(() => showToast('विड्रॉल रिजेक्ट! पैसे वापस हुए।', 'success'))
    .catch(e => showToast('Error: ' + e.message, 'error'));
}

  if (!window.db || !confirm('डिब्बा खाली करें?')) return;
  window.db.ref('tp_trash').remove().then(() => {
    showToast('डिब्बा पूरी तरह खाली हो गया!', 'success');
  }).catch(e => showToast('Error: ' + e.message, 'error'));
}

// ============================================================
// ====================== WINDOW LOAD ==========================
// ============================================================
window.onload = function() {
  if (!checkSession()) {
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('adminPanel').style.display = 'none';
  }
};
</script>

</body>
