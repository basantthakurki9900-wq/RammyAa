function filterByDays(items, days, getTime) {
  if (days === 0 || days === 'all') return items;

  return items.filter(it => {
    const t = getTime(it);

}

function showToast(msg, type = 'success') { 
  const toast = document.getElementById('toast');
  if (!toast) {
    // Create toast element if not exists (since we removed static HTML toast)
    const newToast = document.createElement('div');
    newToast.id = 'toast';
    newToast.className = 'toast hidden';
    newToast.innerHTML = '<div class="toast-inner" id="toastInner"><div class="icon" id="toastIcon">✅</div><div class="msg" id="toastMsg"></div></div>';
    document.body.appendChild(newToast);
  }
  const toastEl = document.getElementById('toast');
  const inner = toastEl.querySelector('.toast-inner');
  const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
  inner.className = 'toast-inner ' + type;
  inner.querySelector('.icon').textContent = icons[type] || '✅';
  inner.querySelector('.msg').textContent = msg;
  toastEl.classList.remove('hidden');
  toastEl.classList.add('show');
  // Re-trigger animation
  inner.style.animation = 'none';
  setTimeout(() => { inner.style.animation = 'popIn 0.35s cubic-bezier(0.16, 1, 0.3, 1)'; }, 10);
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => { 
    toastEl.classList.remove('show'); 
    setTimeout(() => toastEl.classList.add('hidden'), 200); 
  }, 2000);
}

function copyDemoCreds(mobile, password) {
  const text = `🎭 Demo Login\n📱 Mobile: ${mobile}\n🔑 Password: ${password}`;
  navigator.clipboard.writeText(text).then(() => showToast('📋 क्रेडेंशियल कॉपी हो गया!', 'success')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    showToast('📋 क्रेडेंशियल कॉपी हो गया!', 'success');
  });
}

function editDemo(id) {
  const d = users[id]; if (!d) return showToast('डेमो नहीं मिला', 'error');

  if (newMobile.length !== 10) return showToast('मोबाइल 10 अंकों का होना चाहिए', 'warning');
  saveUserToDB(id, { name: newName.trim(), mobile: newMobile.trim(), password: newPass.trim() });
  addAdminLog('demo_edit', id, 'Demo edited');
}

// ✅ NEW: View Bank Details Popup
function viewBankDetails(userId) {
  closeAllMenus();
  const u = users[userId];
  if (!u) return showToast('यूजर नहीं मिला', 'error');
  const bank = u.bankDetails;
  if (!bank || (!bank.bankName && !bank.accNumber)) {
    return showToast('इस यूजर ने कोई बैंक डिटेल्स नहीं जोड़ी', 'warning');
  }
  const text = `🏦 बैंक: ${bank.bankName || 'N/A'}\n👤 होल्डर: ${bank.accName || 'N/A'}\n🔢 अकाउंट: ${bank.accNumber || 'N/A'}\n🏷️ IFSC: ${bank.ifsc || 'N/A'}${bank.upi ? '\n📱 UPI: ' + bank.upi : ''}`;
  navigator.clipboard.writeText(text).then(() => {
    showTickPopup('success', '🏦 बैंक डिटेल्स कॉपी हो गईं!');
  }).catch(() => {
    alert(text);
    showTickPopup('success', '🏦 बैंक डिटेल्स दिखाई गईं');
  });
}

function renderUserReport(u) {
  const totalDeposit = (u.depositHistory || []).reduce((s, d) => s + (parseInt(d.amount)||0) + (parseInt(d.bonus)||0), 0);
  const totalWithdraw = (u.withdrawHistory || []).filter(w => w.status === 'Approved').reduce((s, w) => s + (parseInt(w.amount)||0), 0);
  const totalGames = (u.gameHistory || []).length;
  const wins = (u.gameHistory || []).filter(g => g.result === 'Win').length;
  const losses = (u.gameHistory || []).filter(g => g.result === 'Loss').length;
  const proGames = (u.gameHistory || []).filter(g => g.type === 'proTeenPatti').length;
  const proWins = (u.gameHistory || []).filter(g => g.type === 'proTeenPatti' && g.result === 'Win').length;
  const bank = u.bankDetails || {};
  return `<div class="report-grid">
    <div class="report-item"><span>कुल बैलेंस</span><span class="text-green">₹${(u.balance || 0).toLocaleString()}</span></div>
    <div class="report-item"><span>विड्रॉल बैलेंस</span><span class="text-yellow">₹${Math.min((u.withdrawableBalance||0), (u.balance||0)).toLocaleString()}</span></div>
    <div class="report-item"><span>कुल डिपॉजिट</span><span class="text-green">₹${totalDeposit.toLocaleString()}</span></div>
    <div class="report-item"><span>कुल विड्रॉल</span><span class="text-red">₹${totalWithdraw.toLocaleString()}</span></div>
    <div class="report-item"><span>कुल गेम्स</span><span class="text-white">${totalGames}</span></div>
    <div class="report-item"><span>जीत/हार</span><span class="text-white">${wins}/${losses}</span></div>
    <div class="report-item"><span>PRO गेम्स</span><span class="text-purple">${proGames} (जीत: ${proWins})</span></div>
    <div class="report-item"><span>विड्रॉल होल्ड</span><span class="${u.withdrawHeld ? 'text-red' : 'text-green'}">${u.withdrawHeld ? '🔒 होल्ड' : '✅ सक्रिय'}</span></div>
    <div class="report-item"><span>कस्टम टैक्स</span><span class="text-yellow">${u.customWithdrawTax !== undefined ? u.customWithdrawTax + '%' : 'डिफ़ॉल्ट'}</span></div>
    <div class="report-item"><span>डिवाइस ID</span><span class="text-xs text-gray">${escapeHtml(u.deviceId || 'N/A')}</span></div>
    <div class="report-item"><span>बैंक</span><span class="text-green">${escapeHtml(bank.bankName || 'N/A')}</span></div>
    <div class="report-item"><span>अकाउंट</span><span class="text-green">${escapeHtml(bank.accNumber || 'N/A')}</span></div>
  </div>`;
}

// ==================== WITHDRAW HOLD & TAX ====================
function toggleWithdrawHold(userId) {
  closeAllMenus();
  const u = users[userId]; if (!u) return showToast('यूजर नहीं मिला', 'error');
  const newState = !u.withdrawHeld;
  saveUserToDB(userId, { withdrawHeld: newState });
  addAdminLog(newState ? 'withdraw_hold' : 'withdraw_unhold', userId, 'Withdraw ' + (newState ? 'held' : 'released'));
  if (newState) showTickPopup('warning', '🔒 विड्रॉल होल्ड!');
  else showTickPopup('success', '🔓 होल्ड हट गया!');
}

function editUserTax(userId) {
  closeAllMenus();
  const u = users[userId]; if (!u) return showToast('यूजर नहीं मिला', 'error');
  const currentTax = u.customWithdrawTax !== undefined ? u.customWithdrawTax : (config.withdrawTax || 5);
  const newTax = prompt('इस यूजर के लिए विड्रॉल टैक्स (%) डालें:\n\n(खाली छोड़ें तो डिफ़ॉल्ट ' + (config.withdrawTax || 5) + '% लगेगा)\n(नंबर डालें जैसे 3, 5, 10)\n\nमौजूदा: ' + currentTax + '%', currentTax);
  if (newTax === null) return;
  if (newTax.trim() === '') {
    saveUserToDB(userId, { customWithdrawTax: null });
    showTickPopup('success', 'डिफ़ॉल्ट टैक्स सेट!');
    addAdminLog('tax_default', userId, 'Tax set to default');
  } else {
    const taxNum = parseFloat(newTax);
    if (isNaN(taxNum) || taxNum < 0 || taxNum > 50) return showToast('टैक्स 0-50 के बीच होना चाहिए', 'warning');
    saveUserToDB(userId, { customWithdrawTax: taxNum });
    showTickPopup('success', 'टैक्स ' + taxNum + '% सेट!');
    addAdminLog('tax_change', userId, 'Tax changed to ' + taxNum + '%');
  }
}

function toggleProStatus(userId) {
  closeAllMenus();
  const u = users[userId]; if (!u) return showToast('यूजर नहीं मिला', 'error');
  const newState = !u.isProPlayer;
  saveUserToDB(userId, { isProPlayer: newState });
  addAdminLog(newState ? 'pro_enable' : 'pro_disable', userId, 'PRO status ' + (newState ? 'enabled' : 'disabled'));
  if (newState) showTickPopup('success', '👑 PRO Status दिया!');
  else showTickPopup('warning', 'PRO Status हटा दिया!');
}

function resetDepositStatus(userId) { closeAllMenus(); if (!confirm('क्या आप इस यूजर का ₹250+ Deposit Status रीसेट करना चाहते हैं?')) return; saveUserToDB(userId, { hasDepositedAfter250: false }); addAdminLog('reset_deposit_status', userId, '₹250+ reset'); showTickPopup('success', '🔄 ₹250+ रीसेट!'); }
function refreshUserData(userId) { closeAllMenus(); if (window.db) { window.db.ref('tp_users/' + userId).once('value').then(snap => { if (snap.val()) { users[userId] = snap.val(); showTickPopup('success', '🔄 डेटा रीफ्रेश!'); setTimeout(() => renderContent(true), 1600); } }); } }

// ==================== DEPOSITS (with date filter) ====================
function renderDeposits() {
  let allDeposits = [];
  Object.values(users).forEach(u => { (u.depositHistory || []).forEach((d, idx) => { allDeposits.push({ ...d, user: u.name, mobile: u.mobile, userId: u.id, index: idx, isDemo: u.isDemo }); }); });
  allDeposits.sort((a,b) => (b.ts || 0) - (a.ts || 0));
  
  const days = dateFilters.depositsTab !== undefined ? dateFilters.depositsTab : 30;
  const filtered = filterByDays(allDeposits, days, d => d.ts || (d.time ? new Date(d.time).getTime() : 0));
  
  let html = renderDateFilter('depositsTab');
  html += `<div class="text-xs text-gray" style="margin-bottom:6px;">${getFilterLabel(days)} में ${filtered.length} डिपॉजिट मिले</div>`;
  
  if (filtered.length === 0) return html + '<div class="card text-gray text-center">इस समय में कोई डिपॉजिट नहीं</div>';
  
  return html + filtered.slice(0, 100).map(d => `<div class="card"><div class="flex-between"><div><div class="text-sm font-bold text-yellow-400">${escapeHtml(d.user || 'N/A')}${d.isDemo ? ' <span class="demo-badge">डेमो</span>' : ''}</div><div class="text-xs text-gray">${escapeHtml(d.mobile || 'N/A')}</div><div class="text-xs text-gray">${escapeHtml(d.time || '')} ${d.utr ? '| ID: ' + escapeHtml(d.utr) : ''}</div><div class="text-xs text-green">${d.bonus ? 'बोनस: ₹' + d.bonus : ''}</div></div><div class="text-right"><div class="text-lg font-bold text-green">+₹${(d.amount || 0) + (d.bonus || 0)}</div><div class="flex-center gap-1" style="margin-top:3px;"><button onclick="deleteDepositItem('${d.userId}', ${d.index})" class="btn-sm btn-red" style="font-size:9px;">🗑️ हटाएं</button></div></div></div></div>`).join('');
}

// ==================== WITHDRAWALS (with date filter) ====================
function renderWithdrawals() {
  let allWithdrawals = [];
  Object.values(users).forEach(u => { (u.withdrawHistory || []).forEach((w, idx) => { allWithdrawals.push({ ...w, user: u.name, mobile: u.mobile, userId: u.id, index: idx, bankDetails: u.bankDetails, isDemo: u.isDemo }); }); });
  allWithdrawals.sort((a,b) => (b.ts || 0) - (a.ts || 0));
  
  const days = dateFilters.withdrawalsTab !== undefined ? dateFilters.withdrawalsTab : 30;
  const filtered = filterByDays(allWithdrawals, days, w => w.ts || (w.time ? new Date(w.time).getTime() : 0));
  
  let html = renderDateFilter('withdrawalsTab');
  html += `<div class="text-xs text-gray" style="margin-bottom:6px;">${getFilterLabel(days)} में ${filtered.length} विड्रॉल मिले</div>`;

function renderUtrRequests() {

  allReqs.sort((a,b) => (b.ts || 0) - (a.ts || 0));
  
  const days = dateFilters.utrTab !== undefined ? dateFilters.utrTab : 30;
  const filtered = filterByDays(allReqs, days, r => r.ts || (r.time ? new Date(r.time).getTime() : 0));
  
  let html = renderDateFilter('utrTab');
  html += `<div class="text-xs text-gray" style="margin-bottom:6px;">${getFilterLabel(days)} में ${filtered.length} अनुरोध मिले</div>`;

function approveUtr(userId, index) {
  const u = users[userId]; if (!u) return showToast('यूजर नहीं मिला', 'error');
  const reqs = u.utrRequests || []; if (index >= reqs.length) return showToast('अनुरोध नहीं मिला', 'error');
  const req = reqs[index]; if (!req || req.status !== 'Pending') return showToast('यह पहले ही प्रोसेस हो चुका है', 'warning');
  reqs[index].status = 'Approved';
  const depHist = Array.isArray(u.depositHistory) ? u.depositHistory : [];
  const bonusAmt = Math.floor(req.amount * ((config.depositBonusPercent || 5) / 100));
  const totalAmt = req.amount + bonusAmt;
  depHist.push({ amount: req.amount, bonus: bonusAmt, time: new Date().toLocaleString(), ts: Date.now(), desc: `UTR Approved (+${config.depositBonusPercent || 5}% Bonus)`, status: 'Success', utr: req.utr });
  const updates = { utrRequests: reqs, depositHistory: depHist.slice(-30), balance: (u.balance || 0) + totalAmt, bonusBalance: (u.bonusBalance || 0) + bonusAmt };
  if (req.amount >= 100) updates.hasDepositedAfter250 = true;
  if (window.db) { window.db.ref('tp_users/' + userId).update(updates).then(() => { users[userId] = { ...users[userId], ...updates }; addAdminLog('utr_approve', userId, 'UTR ₹' + req.amount + ' approved'); showTickPopup('success', 'UTR स्वीकृत! ₹' + totalAmt); setTimeout(() => renderContent(true), 1600); }); }
}
function rejectUtr(userId, index) {
  const u = users[userId]; if (!u) return showToast('यूजर नहीं मिला', 'error');
  const reqs = u.utrRequests || []; if (index >= reqs.length) return showToast('अनुरोध नहीं मिला', 'error');
  const req = reqs[index]; if (!req || req.status !== 'Pending') return showToast('यह पहले ही प्रोसेस हो चुका है', 'warning');
  reqs[index].status = 'Rejected';
  if (window.db) { window.db.ref('tp_users/' + userId + '/utrRequests').set(reqs).then(() => { users[userId].utrRequests = reqs; addAdminLog('utr_reject', userId, 'UTR ₹' + req.amount + ' rejected'); showTickPopup('warning', 'UTR अस्वीकृत!'); setTimeout(() => renderContent(true), 1600); }); }
}

function adjustBalance(id, type) {
  const amt = parseInt(document.getElementById('amt_' + id).value);
  if (!amt || amt <= 0) return showToast('वैध राशि दर्ज करें', 'warning');
  const u = users[id]; if (!u) return showToast('यूजर नहीं मिला', 'error');
  const updates = {}; const newBalance = type === 'add' ? (u.balance || 0) + amt : Math.max(0, (u.balance || 0) - amt);
  if (type === 'add') {
    updates.balance = newBalance;
    updates.bonusBalance = (u.bonusBalance || 0) + amt;
    if (amt >= 100) updates.hasDepositedAfter250 = true; 
    const hist = Array.isArray(u.depositHistory) ? u.depositHistory : [];
    hist.push({ amount: amt, time: new Date().toLocaleString(), ts: Date.now(), desc: 'Admin Added', status: 'Success' });
    updates.depositHistory = hist.slice(-30);
  } else {
    updates.balance = newBalance;
    const hist = Array.isArray(u.withdrawHistory) ? u.withdrawHistory : [];
    hist.push({ txId: Date.now(), amount: amt, time: new Date().toLocaleString(), ts: Date.now(), status: 'Admin Deducted' });
    updates.withdrawHistory = hist.slice(-30);
  }
  users[id] = { ...users[id], ...updates };
  if (window.db) {
    window.db.ref('tp_users/' + id).update(updates).then(() => {
      addAdminLog(type === 'add' ? 'balance_add' : 'balance_deduct', id, (type === 'add' ? 'Added' : 'Deducted') + ' ₹' + amt);
      showTickPopup('success', (type === 'add' ? '₹' + amt + ' जोड़े!' : '₹' + amt + ' कटे!'));
      setTimeout(() => renderContent(true), 1600);
    }).catch(e => showToast('Error: ' + e.message, 'error'));
  }
  document.getElementById('amt_' + id).value = '';
}

function deductWithdrawableBalance(id) {
  const amt = parseInt(document.getElementById('wd_amt_' + id).value);
  if (!amt || amt <= 0) return showToast('वैध राशि दर्ज करें', 'warning');
  const u = users[id]; if (!u) return showToast('यूजर नहीं मिला', 'error');
  const currentWd = u.withdrawableBalance || 0; const currentBal = u.balance || 0;
  if (amt > currentWd) return showToast('इतना विड्रॉल बैलेंस नहीं है। केवल ₹' + currentWd + ' उपलब्ध', 'error');
  const newWd = Math.max(0, currentWd - amt); const newBal = Math.max(0, currentBal - amt);
  if (window.db) {
    window.db.ref('tp_users/' + id).update({ withdrawableBalance: newWd, balance: newBal }).then(() => {
      users[id].withdrawableBalance = newWd; users[id].balance = newBal;
      addAdminLog('wd_balance_deduct', id, 'Deducted ₹' + amt);
      showTickPopup('success', '✂️ ₹' + amt + ' कटे!');
      document.getElementById('wd_amt_' + id).value = '';
      setTimeout(() => renderContent(true), 1600);
    }).catch(e => showToast('Error: ' + e.message, 'error'));
  }
}

function changePass(id) { const pass = document.getElementById('pass_' + id).value; if (!pass) return showToast('पासवर्ड दर्ज करें', 'warning'); saveUserToDB(id, { password: pass }); addAdminLog('password_change', id, 'Password changed'); showTickPopup('success', 'पासवर्ड बदला!'); }
function deleteUserToTrash(id) { if (!confirm('यूजर को डिब्बे में भेजें?')) return; if (!window.db) return; const userRef = window.db.ref('tp_users/' + id); const trashRef = window.db.ref('tp_trash/' + id); userRef.once('value').then(snap => { if (snap.val()) { trashRef.set(snap.val()).then(() => { userRef.remove().then(() => { addAdminLog('trash_move', id, 'User moved to trash'); showTickPopup('success', 'यूजर डिब्बे में!'); setTimeout(() => scheduleRender(true), 1600); }); }); } }); }
function restoreUser(id) { if (!window.db) return; const trashRef = window.db.ref('tp_trash/' + id); const userRef = window.db.ref('tp_users/' + id); trashRef.once('value').then(snap => { if (snap.val()) { userRef.set(snap.val()).then(() => { trashRef.remove().then(() => { addAdminLog('trash_restore', id, 'User restored'); showTickPopup('success', 'यूजर वापस!'); setTimeout(() => scheduleRender(true), 1600); }); }); } }); }
function deleteUserPermanently(id) { if (!confirm('इस यूजर को हमेशा के लिए हटाएं?')) return; if (!window.db) return; window.db.ref('tp_trash/' + id).remove().then(() => { addAdminLog('permanent_delete', id, 'User permanently deleted'); showTickPopup('success', 'यूजर पक्का डिलीट!'); setTimeout(() => scheduleRender(true), 1600); }); }
function approveWithdraw(userId, txId) { if (!confirm('विड्रॉल स्वीकृत करें?')) return; const u = users[userId]; if (!u) return; const history = u.withdrawHistory || []; const tx = history.find(t => t.txId === txId); if (!tx) return; tx.status = 'Approved'; window.db.ref('tp_users/' + userId + '/withdrawHistory').set(history).then(() => { users[userId].withdrawHistory = history; addAdminLog('withdraw_approve', userId, '₹' + tx.amount + ' approved'); showTickPopup('success', 'विड्रॉल स्वीकृत!'); setTimeout(() => renderContent(true), 1600); }); }
function rejectWithdraw(userId, txId) { if (!confirm('विड्रॉल रिजेक्ट करें? पैसे वापस होंगे।')) return; const u = users[userId]; if (!u) return; const history = u.withdrawHistory || []; const tx = history.find(t => t.txId === txId); if (!tx) return; tx.status = 'Rejected'; const newBalance = (u.balance || 0) + tx.amount; const newWd = (u.withdrawableBalance || 0) + tx.amount; window.db.ref('tp_users/' + userId).update({ withdrawHistory: history, balance: newBalance, withdrawableBalance: newWd }).then(() => { users[userId].withdrawHistory = history; users[userId].balance = newBalance; users[userId].withdrawableBalance = newWd; addAdminLog('withdraw_reject', userId, '₹' + tx.amount + ' rejected'); showTickPopup('warning', 'विड्रॉल रिजेक्ट!'); setTimeout(() => renderContent(true), 1600); }); }
function emptyTrash() { if (!window.db || !confirm('डिब्बा खाली करें?')) return; window.db.ref('tp_trash').remove().then(() => { addAdminLog('empty_trash', 'all', 'Trash emptied'); showTickPopup('success', 'डिब्बा खाली!'); setTimeout(() => scheduleRender(true), 1600); }); }
function exportData() { let csv = 'ID,Name,Mobile,Balance,Withdrawable,Bonus,Blocked,Demo,PRO,WithdrawHold,Tax %,Referral Code,Referral Earnings,Total Games,Total Deposits,Total Withdrawals,Bank Name,Acc Holder,Acc Number,IFSC,UPI\n'; Object.values(users).forEach(u => { const totalDep = (u.depositHistory || []).reduce((s, d) => s + (parseInt(d.amount)||0) + (parseInt(d.bonus)||0), 0); const totalWd = (u.withdrawHistory || []).filter(w => w.status === 'Approved').reduce((s, w) => s + (parseInt(w.amount)||0), 0); const totalGames = (u.gameHistory || []).length; const bank = u.bankDetails || {}; csv += `${u.id},${u.name},${u.mobile},${u.balance||0},${u.withdrawableBalance||0},${u.bonusBalance||0},${u.isBlocked?'Yes':'No'},${u.isDemo?'Yes':'No'},${u.isProPlayer?'Yes':'No'},${u.withdrawHeld?'Yes':'No'},${u.customWithdrawTax !== undefined ? u.customWithdrawTax : (config.withdrawTax || 5)},${u.referralCode||'N/A'},${u.referralEarnings||0},${totalGames},${totalDep},${totalWd},${bank.bankName||''},${bank.accName||''},${bank.accNumber||''},${bank.ifsc||''},${bank.upi||''}\n`; }); const blob = new Blob([csv], { type: 'text/csv' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = 'royal_casino_users_' + new Date().toISOString().slice(0,10) + '.csv'; a.click(); URL.revokeObjectURL(url); showTickPopup('success', '📊 डेटा एक्सपोर्ट!'); }

window.onload = function() {
  if (!checkSession()) {
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('adminPanel').style.display = 'none';
  } else {
    showAdminPanel();
  }
};
</script>
