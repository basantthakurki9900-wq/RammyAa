<body>

<div class="app" id="app">

      <div class="nav-item active" onclick="setTab('home')" id="nav_home"><span class="icon">🏠</span>होम</div>

      <div class="nav-item" onclick="setTab('withdrawals')" id="nav_withdrawals"><span class="icon">⬆️</span>विड्रॉल</div>
      <div class="nav-item" onclick="setTab('referrals')" id="nav_referrals"><span class="icon">🎁</span>रेफरल</div>
      <div class="nav-item" onclick="setTab('reports')" id="nav_reports"><span class="icon">📊</span>रिपोर्ट</div>

    <div id="toast" class="toast hidden">
      <div class="toast-inner">
        <div class="icon" id="toastIcon">✅</div>
        <div class="msg" id="toastMsg">Action Successful</div>
      </div>
    </div>
  </div>
</div>

<script>
// ============================================================
// ====================== CONFIG ===============================
// ============================================================
const ADMIN_PASSWORD = "admin123";
const SESSION_KEY = 'tp_admin_session';
const defaultConfig = {
  telegramLink: "https://t.me/royalcasino",
  whatsappLink: "https://wa.me/919999999999",
  minWithdraw: 100,
  promoCodes: [],
  bankList: ["SBI", "HDFC", "ICICI", "Axis", "Other"],
  fakeOnline: 50,
  fakePlaying: 10,
  depositAmounts: [100, 200, 500, 1000],
  broadcastMsg: ""
};

// ============================================================
// ====================== STATE ================================
// ============================================================
let users = {};
let trashUsers = {};
let config = { ...defaultConfig };
let liveTables = {};
let activeTab = 'home';
let searchQuery = '';
let isSearching = false;
let isRendering = false;
let renderTimer = null;
let dataLoaded = false;
let listenersActive = false;
let adminLogs = [];

let userListener = null;
let trashListener = null;
let configListener = null;
let tablesListener = null;
let logsListener = null;

// ============================================================
// ====================== FIREBASE =============================
// ============================================================
function initFirebase() {
  if (!window.db) {
    document.getElementById('liveStatus').innerHTML = '<span class="dot offline"></span> DB Error';
    return;
  }

  document.getElementById('liveStatus').innerHTML = '<span class="dot online" id="statusDot"></span> कनेक्टेड';
  detachListeners();

  try {
    userListener = window.db.ref('tp_users');
    userListener.on('value', (snap) => {
      const newUsers = snap.val() || {};
      const changed = JSON.stringify(users) !== JSON.stringify(newUsers);
      users = newUsers;
      dataLoaded = true;
      if (changed && !isSearching) {
        if (renderTimer) { clearTimeout(renderTimer); renderTimer = null; }
        renderContent(true);
      }
    });

    trashListener = window.db.ref('tp_trash');
    trashListener.on('value', (snap) => {
      trashUsers = snap.val() || {};
      if (!isSearching) scheduleRender();
    });

    configListener = window.db.ref('tp_config');
    configListener.on('value', (snap) => {
      const val = snap.val();
      if (!val) {
        config = { ...defaultConfig };
        window.db.ref('tp_config').set(config);
      } else {
        config = { ...defaultConfig, ...val };
      }
      if (!isSearching) scheduleRender();
    });

    tablesListener = window.db.ref('tp_live_tables');
    tablesListener.on('value', (snap) => {
      liveTables = snap.val() || {};
      if (!isSearching) scheduleRender();
    });

    logsListener = window.db.ref('tp_admin_logs');
    logsListener.on('value', (snap) => {
      adminLogs = snap.val() || [];
      if (!isSearching) scheduleRender();
    });

    listenersActive = true;
  } catch(e) {
    console.error("Firebase listener error:", e);
    document.getElementById('contentArea').innerHTML = '<div class="card text-red-400">Firebase Error: ' + e.message + '</div>';
  }
}

function detachListeners() {
  try {
    if (userListener) { userListener.off(); userListener = null; }
    if (trashListener) { trashListener.off(); trashListener = null; }
    if (configListener) { configListener.off(); configListener = null; }
    if (tablesListener) { tablesListener.off(); tablesListener = null; }
    if (logsListener) { logsListener.off(); logsListener = null; }
  } catch(e) {}
  listenersActive = false;
}

// ============================================================
// ====================== RENDER THROTTLING ===================
// ============================================================
function scheduleRender(immediate = false) {
  if (isSearching && !immediate) return;
  if (renderTimer) { clearTimeout(renderTimer); renderTimer = null; }
  if (immediate) {
    renderContent(true);
  } else {
    renderTimer = setTimeout(() => {
      renderTimer = null;
      renderContent();
    }, 200);
  }
}

function renderContent(force = false) {
  if (!force && (isRendering || isSearching)) return;
  isRendering = true;
  const area = document.getElementById('contentArea');
  
  try {
    if (!dataLoaded && !force) {
      area.innerHTML = '<div class="loading"><div class="spinner"></div>डेटा लोड हो रहा है...</div>';
      isRendering = false;
      return;
    }

    if (force) dataLoaded = true;

    switch(activeTab) {
      case 'home': area.innerHTML = renderHome(); break;
      case 'users': area.innerHTML = renderUsers(); break;
      case 'deposits': area.innerHTML = renderDeposits(); break;
      case 'withdrawals': area.innerHTML = renderWithdrawals(); break;
      case 'referrals': area.innerHTML = renderReferrals(); break;
      case 'reports': area.innerHTML = renderReports(); break;
      case 'logs': area.innerHTML = renderLogs(); break;
      case 'trash': area.innerHTML = renderTrash(); break;
      default: area.innerHTML = '<div class="card text-gray">पेज नहीं मिला</div>';
    }
  } catch(e) {
    area.innerHTML = '<div class="card text-red-400">Error: ' + escapeHtml(e.message) + '</div>';
    console.error('Render Error:', e);
  }
  isRendering = false;
}

// ============================================================
// ====================== FORCE REFRESH =======================
// ============================================================
function forceRefreshAdmin() {
  if (!window.db) {
    showToast('Database not connected', 'error');
    return;
  }
  
  showToast('🔄 डेटा रीफ्रेश हो रहा है...', 'info');
  
  Promise.all([
    window.db.ref('tp_users').once('value'),
    window.db.ref('tp_trash').once('value'),
    window.db.ref('tp_config').once('value'),
    window.db.ref('tp_live_tables').once('value'),
    window.db.ref('tp_admin_logs').once('value')
  ]).then(([usersSnap, trashSnap, configSnap, tablesSnap, logsSnap]) => {
    users = usersSnap.val() || {};
    trashUsers = trashSnap.val() || {};
    config = { ...defaultConfig, ...(configSnap.val() || {}) };
    liveTables = tablesSnap.val() || {};
    adminLogs = logsSnap.val() || [];
    dataLoaded = true;
    
    renderContent(true);
    showToast('✅ डेटा रीफ्रेश हो गया!', 'success');
  }).catch(e => {
    showToast('Error: ' + e.message, 'error');
  });
}

// ============================================================
// ====================== LOGIN / LOGOUT =======================
// ============================================================
function checkSession() {
  if (sessionStorage.getItem(SESSION_KEY) === 'true') {
    showAdminPanel();
    return true;
  }
  return false;
}

function doLogin() {
  const pass = document.getElementById('adminPass').value;
  if (pass === ADMIN_PASSWORD) {
    sessionStorage.setItem(SESSION_KEY, 'true');
    showAdminPanel();
  } else {
    showToast('गलत पासवर्ड!', 'error');
  }
}

function doLogout() {
  if (confirm('क्या आप लॉगआउट करना चाहते हैं?')) {
    sessionStorage.removeItem(SESSION_KEY);
    document.getElementById('adminPanel').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('adminPass').value = '';
    detachListeners();
  }
}

function showAdminPanel() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('adminPanel').style.display = 'flex';
  dataLoaded = false;
  initFirebase();
  setTab('home');
}

// ============================================================
// ====================== TOAST ================================
// ============================================================
function showToast(msg, type = 'success') {
  const toast = document.getElementById('toast');
  const icon = document.getElementById('toastIcon');
  const msgEl = document.getElementById('toastMsg');
  
  const icons = {
    success: '✅',
    error: '❌',
    warning: '⚠️',
    info: 'ℹ️'
  };
  icon.textContent = icons[type] || '✅';
  msgEl.textContent = msg;
  toast.classList.remove('hidden');
  setTimeout(() => toast.classList.add('hidden'), 2500);
}

// ============================================================
// ====================== TAB MANAGEMENT =======================
// ============================================================
function setTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const navEl = document.getElementById('nav_' + tab);
  if (navEl) navEl.classList.add('active');
  
  isSearching = false;
  searchQuery = '';
  
  if (renderTimer) { clearTimeout(renderTimer); renderTimer = null; }
  renderContent();
}

function refreshData() {
  detachListeners();

// ============================================================
// ====================== SEARCH ===============================
// ============================================================
function startSearch() {
  isSearching = true;
}

function doSearch() {
  const el = document.getElementById('searchInput');
  if (el) {
    searchQuery = el.value.toLowerCase().trim();
    renderContent(true);
  }
}

function exitSearch() {
  isSearching = false;
  searchQuery = '';
  const input = document.getElementById('searchInput');
  if (input) input.value = '';
  renderContent();
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && document.activeElement && document.activeElement.id === 'searchInput') {
    doSearch();
  }
  if (e.key === 'Escape' && isSearching) {
    exitSearch();
  }
});

// ============================================================
// ====================== MENU FUNCTIONS ======================
// ============================================================
function toggleMenu(userId, event) {
  event.stopPropagation();
  
  document.querySelectorAll('.menu-dropdown').forEach(el => {
    if (el.id !== 'menu_' + userId) {
      el.classList.remove('show');
    }
  });
  
  document.querySelectorAll('.menu-overlay').forEach(el => {
    if (el.id !== 'overlay_' + userId) {
      el.classList.remove('show');
    }
  });
  
  const menu = document.getElementById('menu_' + userId);
  const overlay = document.getElementById('overlay_' + userId);
  
  if (menu) {
    menu.classList.toggle('show');
  }
  if (overlay) {
    overlay.classList.toggle('show');
  }
}

function closeAllMenus() {
  document.querySelectorAll('.menu-dropdown').forEach(el => el.classList.remove('show'));
  document.querySelectorAll('.menu-overlay').forEach(el => el.classList.remove('show'));
}

document.addEventListener('click', function() {
  closeAllMenus();
});

// ====================== DB HELPERS ===========================
// ============================================================
function saveUserToDB(id, data) {
  if (window.db) {
    window.db.ref('tp_users/' + id).update(data)
      .then(() => {
        if (users[id]) {
          users[id] = { ...users[id], ...data };
        }
        if (!isSearching) {
          if (renderTimer) { clearTimeout(renderTimer); renderTimer = null; }
          renderContent(true);
        }
        showToast('✅ अपडेट सफल!', 'success');
      })
      .catch(e => showToast('DB Error: ' + e.message, 'error'));
  }
}

function saveConfigToDB() {
  if (window.db) {
    window.db.ref('tp_config').set(config).catch(e => showToast('Config Error: ' + e.message, 'error'));
  }
}

function addAdminLog(action, userId, details = '') {
  const logEntry = {
    timestamp: Date.now(),
    time: new Date().toLocaleString(),
    action: action,
    userId: userId,
    userName: users[userId] ? users[userId].name : (trashUsers[userId] ? trashUsers[userId].name : 'Unknown'),
    details: details
  };
  if (window.db) {
    window.db.ref('tp_admin_logs').push(logEntry).catch(e => console.error('Log error:', e));
  }
  adminLogs.push(logEntry);
}

function escapeHtml(text) {
  if (text === null || text === undefined) return '';
  const div = document.createElement('div');
  div.textContent = String(text);
  return div.innerHTML;
}

// ============================================================
// ====================== DELETE GHOST IDs =====================
// ============================================================
function deleteGhostIds() {
  if (!window.db) return showToast('डेटाबेस कनेक्ट नहीं है', 'error');
  
  let ghostIds = [];
  let updates = {};
  
  Object.keys(users).forEach(id => {
    const u = users[id];
    if (!u || !u.name || !u.mobile || u.mobile.length < 10 || !u.balance) {
      ghostIds.push(id);
      updates['tp_users/' + id] = null;
    }
  });
  
  if (ghostIds.length === 0) {
    showToast('✅ कोई फालतू आईडी नहीं मिली!', 'success');
    return;
  }
  
  if (confirm(ghostIds.length + ' फालतू आईडी मिलीं। क्या आप सभी हटाना चाहते हैं?\n\n' + ghostIds.join(', '))) {
    window.db.ref().update(updates)
      .then(() => {
        ghostIds.forEach(id => {
          delete users[id];
          addAdminLog('ghost_delete', id, 'Ghost ID deleted');
        });
        showToast(ghostIds.length + ' फालतू आईडी हटा दी गईं! ✅', 'success');
        scheduleRender(true);
      })
      .catch(e => showToast('Error: ' + e.message, 'error'));
  }
}

// ============================================================
// ====================== RESTORE USER BY MOBILE ===============
// ============================================================
function restoreUserByMobile() {
  const mobile = document.getElementById('restoreMobileInput').value.trim();
  const resultEl = document.getElementById('restoreResult');
  
  if (!mobile || mobile.length !== 10) {
    resultEl.innerHTML = '<span class="text-red-400">❌ कृपया 10 अंकों का मोबाइल नंबर दर्ज करें</span>';
    return;
  }

  let foundInTrash = false;
  let trashUserId = null;
  
  Object.entries(trashUsers).forEach(([id, u]) => {
    if (u.mobile === mobile) {
      foundInTrash = true;
      trashUserId = id;
    }
  });

  if (foundInTrash && trashUserId) {
    if (!window.db) {
      resultEl.innerHTML = '<span class="text-red-400">❌ डेटाबेस कनेक्ट नहीं है</span>';
      return;
    }
    
    const trashRef = window.db.ref('tp_trash/' + trashUserId);
    const userRef = window.db.ref('tp_users/' + trashUserId);
    
    trashRef.once('value').then(snap => {
      if (snap.val()) {
        userRef.set(snap.val()).then(() => {
          trashRef.remove().then(() => {
            addAdminLog('trash_restore', trashUserId, 'Restored by mobile: ' + mobile);
            resultEl.innerHTML = `<span class="text-green-400">✅ यूजर (${escapeHtml(snap.val().name || 'N/A')}) वापस लाया गया!</span>`;
            showToast('✅ यूजर रिस्टोर हो गया!', 'success');
            document.getElementById('restoreMobileInput').value = '';
            scheduleRender(true);
          });
        });
      } else {
        resultEl.innerHTML = '<span class="text-red-400">❌ डिब्बे में यूजर नहीं मिला</span>';
      }
    }).catch(e => {
      resultEl.innerHTML = '<span class="text-red-400">❌ Error: ' + e.message + '</span>';
    });
    return;
  }

  let foundInUsers = false;
  Object.values(users).forEach(u => {
    if (u.mobile === mobile) {
      foundInUsers = true;
    }
  });

  if (foundInUsers) {
    resultEl.innerHTML = '<span class="text-yellow-400">⚠️ यह यूजर पहले से मौजूद है!</span>';
    return;
  }

  resultEl.innerHTML = '<span class="text-red-400">❌ इस मोबाइल नंबर का कोई हटाया गया यूजर नहीं मिला</span>';
}

// ============================================================
function renderUserReport(u) {
  const totalDeposit = (u.depositHistory || []).reduce((s, d) => s + (parseInt(d.amount)||0), 0);
  const totalWithdraw = (u.withdrawHistory || []).filter(w => w.status === 'Approved' && !w._deleted).reduce((s, w) => s + (parseInt(w.amount)||0), 0);
  const totalGames = (u.gameHistory || []).length;
  const wins = (u.gameHistory || []).filter(g => g.result === 'Win').length;
  const losses = (u.gameHistory || []).filter(g => g.result === 'Loss').length;
  const pendingWithdraw = (u.withdrawHistory || []).filter(w => w.status === 'Pending' && !w._deleted).length;
  const referredCount = Object.values(users).filter(r => r.referredBy === u.referralCode).length;

  return `
    <div class="report-grid">
      <div class="report-item"><span>कुल बैलेंस</span><span class="text-green">₹${(u.balance || 0).toLocaleString()}</span></div>
      <div class="report-item"><span>विड्रॉल बैलेंस</span><span class="text-yellow">₹${Math.min((u.withdrawableBalance||0), (u.balance||0)).toLocaleString()}</span></div>
      <div class="report-item"><span>बोनस बैलेंस</span><span class="text-purple-400">₹${(u.bonusBalance||0).toLocaleString()}</span></div>
      <div class="report-item"><span>कुल डिपॉजिट</span><span class="text-green">₹${totalDeposit.toLocaleString()}</span></div>
      <div class="report-item"><span>कुल विड्रॉल</span><span class="text-red">₹${totalWithdraw.toLocaleString()}</span></div>
      <div class="report-item"><span>कुल गेम्स</span><span class="text-white">${totalGames}</span></div>
      <div class="report-item"><span>जीत/हार</span><span class="text-white">${wins}/${losses}</span></div>
      <div class="report-item"><span>पेंडिंग विड्रॉल</span><span class="text-yellow">${pendingWithdraw}</span></div>
      <div class="report-item"><span>रेफरल कमाई</span><span class="text-green">₹${(u.referralEarnings||0).toLocaleString()}</span></div>
      <div class="report-item"><span>कुल रेफरल्स</span><span class="text-white">${referredCount}</span></div>
      <div class="report-item"><span>डिवाइस ID</span><span class="text-xs text-gray">${escapeHtml(u.deviceId || 'N/A')}</span></div>
    </div>
  `;
}

  closeAllMenus();

    window.db.ref('tp_users/' + userId).once('value').then(snap => {
      if (snap.val()) {
        users[userId] = snap.val();
        showToast('🔄 यूजर डेटा रीफ्रेश हो गया!', 'success');
        renderContent(true);
      }
    }).catch(e => showToast('Error: ' + e.message, 'error'));
  }
}

// ====================== RENDER: DEPOSITS =====================
// ============================================================
function renderDeposits() {
  let allDeposits = [];
  Object.values(users).forEach(u => {
    (u.depositHistory || []).forEach((d, idx) => {
      allDeposits.push({ ...d, user: u.name, mobile: u.mobile, userId: u.id, index: idx });
    });
  });
  allDeposits.sort((a,b) => (b.ts || 0) - (a.ts || 0));

  if (allDeposits.length === 0) {
    return '<div class="card text-gray text-center">कोई डिपॉजिट नहीं मिला</div>';
  }

  return allDeposits.slice(0, 50).map(d => {
    const isDeleted = d._deleted === true;
    return `
      <div class="card ${isDeleted ? 'opacity-50' : ''}">
        <div class="flex-between">
          <div>
            <div class="text-sm font-bold text-yellow-400">${escapeHtml(d.user || 'N/A')}</div>
            <div class="text-xs text-gray">${escapeHtml(d.mobile || 'N/A')}</div>
            <div class="text-xs text-gray">${escapeHtml(d.time || '')} ${d.utr ? '| ID: ' + escapeHtml(d.utr) : ''}</div>
            ${isDeleted ? '<span class="badge badge-deleted">🗑️ हटाई गई</span>' : '<span class="badge badge-approved">✅ सक्रिय</span>'}
          </div>
          <div class="text-right">
            <div class="text-lg font-bold ${isDeleted ? 'text-gray' : 'text-green'}">${isDeleted ? '🗑️' : '+'}₹${d.amount || 0}</div>
            <div class="flex-center gap-1" style="margin-top:3px;">
              ${!isDeleted ? `
                <button onclick="deleteDepositItem('${d.userId}', ${d.index})" class="btn-sm btn-red" style="font-size:9px;">🗑️ हटाएं</button>
              ` : `
                <button onclick="restoreDepositItem('${d.userId}', ${d.index})" class="btn-sm btn-green" style="font-size:9px;">↩️ वापस लाएं</button>
              `}
            </div>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

          </div>
          <div class="text-right">

              ` : `
                <button onclick="restoreWithdrawItem('${w.userId}', ${w.index})" class="btn-sm btn-green" style="font-size:9px;">↩️ वापस लाएं</button>

          </div>
        ` : ''}
      </div>
    `;
  }).join('');
}

// ============================================================
// ====================== RENDER: REFERRALS ====================
// ============================================================
function renderReferrals() {
  const now = new Date();
  const startToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  
  let todayReferrals = [];
  let allReferrals = [];
  
  Object.values(users).forEach(u => {
    if (u.referralCode) {
      const refs = Object.values(users).filter(r => r.referredBy === u.referralCode);
      refs.forEach(r => {
        allReferrals.push({
          referrer: u,
          referred: r,
          referredAt: r.createdAt || 0
        });
        if (r.createdAt && r.createdAt >= startToday) {
          todayReferrals.push({
            referrer: u,
            referred: r,
            referredAt: r.createdAt
          });
        }
      });
    }
  });
  
  todayReferrals.sort((a,b) => b.referredAt - a.referredAt);
  
  const referrerCounts = {};
  allReferrals.forEach(r => {
    const id = r.referrer.id;
    if (!referrerCounts[id]) {
      referrerCounts[id] = { name: r.referrer.name, count: 0, earnings: r.referrer.referralEarnings || 0 };
    }
    referrerCounts[id].count++;
  });
  
  const topReferrers = Object.values(referrerCounts).sort((a,b) => b.count - a.count).slice(0, 10);
  
  let todayHtml = todayReferrals.map(r => `
    <div class="referral-entry">
      <span class="text-yellow">${escapeHtml(r.referrer.name)}</span>
      <span class="text-gray">→</span>
      <span class="text-white">${escapeHtml(r.referred.name)}</span>
      <span class="text-gray text-xs">${escapeHtml(r.referred.mobile)}</span>
      <span class="text-gray text-xs">${new Date(r.referredAt).toLocaleTimeString()}</span>
    </div>
  `).join('');

  let topHtml = topReferrers.map((r, i) => `
    <div class="referral-entry">
      <span class="text-yellow">${i+1}. ${escapeHtml(r.name)}</span>
      <span class="text-white">${r.count} रेफरल्स</span>
      <span class="text-green">₹${r.earnings.toLocaleString()}</span>
    </div>
  `).join('');

  const totalToday = todayReferrals.length;

  return `
    <div class="grid-3" style="margin-bottom:10px;">

// ====================== RENDER: REPORTS ======================
// ============================================================
function renderReports() {
  let totalBalance = 0, totalDeposits = 0, totalWithdrawals = 0;
  let blockedCount = 0, deletedHistoryCount = 0;
  let topDepositors = [], topPlayers = [];

  Object.values(users).forEach(u => {
    totalBalance += (u.balance || 0);
    if (u.isBlocked) blockedCount++;
    
    const userDeposits = (u.depositHistory || []).reduce((s, d) => {
      if (!d._deleted) return s + (parseInt(d.amount)||0);
      return s;
    }, 0);
    totalDeposits += userDeposits;
    
    const userWithdraws = (u.withdrawHistory || []).filter(w => w.status === 'Approved' && !w._deleted).reduce((s, w) => s + (parseInt(w.amount)||0), 0);
    totalWithdrawals += userWithdraws;
    
    const delDep = (u.depositHistory || []).filter(d => d._deleted).length;
    const delWd = (u.withdrawHistory || []).filter(w => w._deleted).length;
    const delGame = (u.gameHistory || []).filter(g => g._deleted).length;
    deletedHistoryCount += (delDep + delWd + delGame);
    
    topDepositors.push({ name: u.name, id: u.id, amount: userDeposits });
    topPlayers.push({ name: u.name, id: u.id, games: (u.gameHistory || []).length });
  });

  topDepositors.sort((a,b) => b.amount - a.amount);
  topPlayers.sort((a,b) => b.games - a.games);

  let topDepHtml = topDepositors.slice(0, 5).map((u, i) => `
    <div class="flex-between text-xs" style="border-bottom:1px solid #1e293b;padding:2px 0;">
      <span>${i+1}. ${escapeHtml(u.name)}</span>
      <span class="text-green">₹${u.amount.toLocaleString()}</span>
    </div>
  `).join('') || '<span class="text-gray text-xs">कोई डेटा नहीं</span>';

  let topPlayHtml = topPlayers.slice(0, 5).map((u, i) => `
    <div class="flex-between text-xs" style="border-bottom:1px solid #1e293b;padding:2px 0;">
      <span>${i+1}. ${escapeHtml(u.name)}</span>
      <span class="text-purple-400">${u.games} गेम्स</span>
    </div>
  `).join('') || '<span class="text-gray text-xs">कोई डेटा नहीं</span>';

  return `
    <div class="grid-2" style="margin-bottom:10px;">
      <div class="stat-box"><div class="num text-green">₹${totalBalance.toLocaleString()}</div><div class="label">कुल बैलेंस</div></div>
      <div class="stat-box"><div class="num text-green">₹${totalDeposits.toLocaleString()}</div><div class="label">कुल डिपॉजिट</div></div>
      <div class="stat-box"><div class="num text-red">₹${totalWithdrawals.toLocaleString()}</div><div class="label">कुल विड्रॉल</div></div>
      <div class="stat-box" style="border-color:#ef4444;"><div class="num text-red">${blockedCount}</div><div class="label">ब्लॉक यूजर्स</div></div>
      <div class="stat-box" style="border-color:#f97316;"><div class="num text-orange-400">${deletedHistoryCount}</div><div class="label">हटाई गई हिस्ट्री</div></div>
      <div class="stat-box"><div class="num text-yellow">${Object.keys(users).length}</div><div class="label">कुल यूजर्स</div></div>
    </div>

    <div class="card">
      <div class="card-title text-green">🏆 टॉप डिपॉजिटर्स</div>
      ${topDepHtml}
    </div>

    <div class="card">
      <div class="card-title text-purple-400">🎮 टॉप गेमर</div>
      ${topPlayHtml}
    </div>

    <div class="card">
      <div class="card-title text-blue-400">📥 एक्सपोर्ट डेटा</div>
      <button onclick="exportData()" class="btn-sm btn-blue" style="width:100%;padding:6px;">📊 CSV डाउनलोड करें</button>
    </div>
  `;
}

function renderLogs() {
  const logs = adminLogs.slice().reverse().slice(0, 100);
  
  let logsHtml = logs.map(log => {
    let actionClass = '';
    let actionIcon = '';
    if (log.action === 'delete' || log.action === 'ghost_delete' || log.action === 'history_delete' || log.action === 'deposit_delete' || log.action === 'withdraw_delete') {
      actionClass = 'delete';
      actionIcon = '🗑️';
    } else if (log.action === 'restore' || log.action === 'history_restore' || log.action === 'trash_restore' || log.action === 'deposit_restore' || log.action === 'withdraw_restore') {
      actionClass = 'restore';
      actionIcon = '↩️';
    } else if (log.action === 'block') {
      actionClass = 'block';
      actionIcon = '🔒';
    } else if (log.action === 'unblock') {
      actionClass = 'unblock';
      actionIcon = '🔓';
    } else if (log.action === 'balance_add' || log.action === 'balance_deduct') {
      actionClass = 'unblock';
      actionIcon = '💰';
    } else {
      actionIcon = '📝';
    }
    
    return `
      <div class="log-entry">
        <span class="log-time">${escapeHtml(log.time || '')}</span>
        <span class="log-action ${actionClass}">${actionIcon} ${escapeHtml(log.action)}</span>
        <span class="text-gray">${escapeHtml(log.userName || 'N/A')} (${escapeHtml(log.userId || '')})</span>
        <span class="text-gray text-xs">${escapeHtml(log.details || '')}</span>
      </div>
    `;
  }).join('');

  return `
    <div class="card" style="border-color:#3b82f6;">
      <div class="card-title text-blue-400">📋 एडमिन एक्टिविटी लॉग्स</div>
      ${logsHtml || '<span class="text-gray text-xs">कोई लॉग नहीं मिला</span>'}
    </div>
  `;
}

// ============================================================
function deleteDepositItem(userId, index) {
  const u = users[userId];
  if (!u) return showToast('यूजर नहीं मिला', 'error');
  
  const history = u.depositHistory || [];
  if (index >= history.length) return showToast('आइटम नहीं मिला', 'error');
  
  const item = history[index];
  if (!item) return showToast('आइटम नहीं मिला', 'error');
  
  if (!confirm(`क्या आप ₹${item.amount} की यह डिपॉजिट हटाना चाहते हैं? (${item.time || ''})`)) return;
  
  history[index] = { ...history[index], _deleted: true };
  
  if (window.db) {
    window.db.ref('tp_users/' + userId + '/depositHistory').set(history)
      .then(() => {
        users[userId].depositHistory = history;
        addAdminLog('deposit_delete', userId, 'Deposit ₹' + item.amount + ' deleted');
        showToast('✅ डिपॉजिट हटा दी गई!', 'success');
        scheduleRender(true);
      })
      .catch(e => showToast('Error: ' + e.message, 'error'));
  }
}

function restoreDepositItem(userId, index) {
  const u = users[userId];
  if (!u) return showToast('यूजर नहीं मिला', 'error');
  
  const history = u.depositHistory || [];
  if (index >= history.length) return showToast('आइटम नहीं मिला', 'error');
  
  const item = history[index];
  if (!item) return showToast('आइटम नहीं मिला', 'error');
  
  if (!item._deleted) return showToast('⚠️ यह डिपॉजिट पहले से सक्रिय है!', 'warning');
  
  delete history[index]._deleted;
  
  if (window.db) {
    window.db.ref('tp_users/' + userId + '/depositHistory').set(history)
      .then(() => {
        users[userId].depositHistory = history;
        addAdminLog('deposit_restore', userId, 'Deposit ₹' + item.amount + ' restored');
        showToast('✅ डिपॉजिट वापस आ गई!', 'success');
        scheduleRender(true);
      })
      .catch(e => showToast('Error: ' + e.message, 'error'));
  }
}

}

function adjustBalance(id, type) {
  const amt = parseInt(document.getElementById('amt_' + id).value);
  if (!amt || amt <= 0) return showToast('वैध राशि दर्ज करें', 'warning');
  const u = users[id];
  if (!u) return showToast('यूजर नहीं मिला', 'error');

  const updates = {};
  const newBalance = type === 'add' ? (u.balance || 0) + amt : Math.max(0, (u.balance || 0) - amt);
  const newWd = type === 'add' ? (u.withdrawableBalance || 0) + amt : Math.max(0, (u.withdrawableBalance || 0) - amt);
  
  updates.balance = newBalance;
  updates.withdrawableBalance = newWd;
  
  if (type === 'add') {
    const hist = Array.isArray(u.depositHistory) ? u.depositHistory : [];
    hist.push({ 
      amount: amt, 
      time: new Date().toLocaleString(), 
      ts: Date.now(), 
      desc: 'Admin Added', 
      status: 'Success' 
    });
    updates.depositHistory = hist.slice(-30);
  } else {
    const hist = Array.isArray(u.withdrawHistory) ? u.withdrawHistory : [];
    hist.push({ 
      txId: Date.now(), 
      amount: amt, 
      time: new Date().toLocaleString(), 
      ts: Date.now(), 
      status: 'Admin Deducted' 
    });
    updates.withdrawHistory = hist.slice(-30);
  }
  
  users[id] = { ...users[id], ...updates };
  
  if (window.db) {
    window.db.ref('tp_users/' + id).update(updates)
      .then(() => {
        addAdminLog(type === 'add' ? 'balance_add' : 'balance_deduct', id, (type === 'add' ? 'Added' : 'Deducted') + ' ₹' + amt);
        showToast((type === 'add' ? '₹' + amt + ' जोड़े गए!' : '₹' + amt + ' कटे!'), 'success');
        // Force re-render
        renderContent(true);
      })
      .catch(e => showToast('Error: ' + e.message, 'error'));
  }
  
  document.getElementById('amt_' + id).value = '';
}

function deleteUserToTrash(id) {
  if (!confirm('यूजर को डिब्बे में भेजें?')) return;
  if (!window.db) return showToast('डेटाबेस कनेक्ट नहीं है', 'error');

  const userRef = window.db.ref('tp_users/' + id);
  const trashRef = window.db.ref('tp_trash/' + id);

  userRef.once('value').then(snap => {
    if (snap.val()) {
      trashRef.set(snap.val()).then(() => {
        userRef.remove().then(() => {
          addAdminLog('trash_move', id, 'User moved to trash');
          showToast('यूजर डिब्बे में गया!', 'success');
          scheduleRender(true);
        });
      });
    } else {
      showToast('यूजर नहीं मिला', 'error');
    }
  }).catch(e => showToast('Error: ' + e.message, 'error'));
}

function restoreUser(id) {
  if (!window.db) return showToast('डेटाबेस कनेक्ट नहीं है', 'error');
  const trashRef = window.db.ref('tp_trash/' + id);
  const userRef = window.db.ref('tp_users/' + id);

  trashRef.once('value').then(snap => {
    if (snap.val()) {
      userRef.set(snap.val()).then(() => {
        trashRef.remove().then(() => {
          addAdminLog('trash_restore', id, 'User restored from trash');
          showToast('यूजर वापस लाया गया!', 'success');
          scheduleRender(true);
        });
      });
    } else {
      showToast('डिब्बे में यूजर नहीं मिला', 'error');
    }
  }).catch(e => showToast('Error: ' + e.message, 'error'));
}

function deleteUserPermanently(id) {
  if (!confirm('इस यूजर को हमेशा के लिए हटाएं?')) return;
  if (!window.db) return showToast('डेटाबेस कनेक्ट नहीं है', 'error');
  window.db.ref('tp_trash/' + id).remove().then(() => {
    addAdminLog('permanent_delete', id, 'User permanently deleted');
    showToast('यूजर पक्का डिलीट हो गया!', 'success');
    scheduleRender(true);
  }).catch(e => showToast('Error: ' + e.message, 'error'));
}

function approveWithdraw(userId, txId) {
  if (!confirm('विड्रॉल स्वीकृत करें?')) return;
  const u = users[userId];
  if (!u) return showToast('यूजर नहीं मिला', 'error');
  const history = u.withdrawHistory || [];
  const tx = history.find(t => t.txId === txId);
  if (!tx) return showToast('ट्रांज़ैक्शन नहीं मिला', 'error');
  tx.status = 'Approved';
  window.db.ref('tp_users/' + userId + '/withdrawHistory').set(history)
    .then(() => {
      users[userId].withdrawHistory = history;
      addAdminLog('withdraw_approve', userId, '₹' + tx.amount + ' approved');
      showToast('विड्रॉल सफल!', 'success');
      renderContent(true);
    })
    .catch(e => showToast('Error: ' + e.message, 'error'));
}

function rejectWithdraw(userId, txId) {
  if (!confirm('विड्रॉल रिजेक्ट करें? पैसे वापस होंगे।')) return;
  const u = users[userId];
  if (!u) return showToast('यूजर नहीं मिला', 'error');
  const history = u.withdrawHistory || [];
  const tx = history.find(t => t.txId === txId);
  if (!tx) return showToast('ट्रांज़ैक्शन नहीं मिला', 'error');
  tx.status = 'Rejected';
  const newBalance = (u.balance || 0) + tx.amount;
  const newWd = (u.withdrawableBalance || 0) + tx.amount;
  window.db.ref('tp_users/' + userId).update({
    withdrawHistory: history,
    balance: newBalance,
    withdrawableBalance: newWd
  }).then(() => {
    users[userId].withdrawHistory = history;
    users[userId].balance = newBalance;
    users[userId].withdrawableBalance = newWd;
    addAdminLog('withdraw_reject', userId, '₹' + tx.amount + ' rejected, refunded');
    showToast('विड्रॉल रिजेक्ट! पैसे वापस हुए।', 'success');
    renderContent(true);
  }).catch(e => showToast('Error: ' + e.message, 'error'));
}

function emptyTrash() {
  if (!window.db || !confirm('डिब्बा खाली करें?')) return;
  window.db.ref('tp_trash').remove().then(() => {
    addAdminLog('empty_trash', 'all', 'Trash emptied');
    showToast('डिब्बा पूरी तरह खाली हो गया!', 'success');
    scheduleRender(true);
  }).catch(e => showToast('Error: ' + e.message, 'error'));
}

function exportData() {
  let csv = 'ID,Name,Mobile,Balance,Withdrawable,Bonus,Blocked,Device ID,Referral Code,Referral Earnings,Total Games,Wins,Losses,Total Deposits,Total Withdrawals,₹250+ Deposited,Joined Date\n';
  
  Object.values(users).forEach(u => {
    const totalDep = (u.depositHistory || []).reduce((s, d) => {
      if (!d._deleted) return s + (parseInt(d.amount)||0);
      return s;
    }, 0);
    const totalWd = (u.withdrawHistory || []).filter(w => w.status === 'Approved' && !w._deleted).reduce((s, w) => s + (parseInt(w.amount)||0), 0);
    const totalGames = (u.gameHistory || []).length;
    const wins = (u.gameHistory || []).filter(g => g.result === 'Win').length;
    const losses = (u.gameHistory || []).filter(g => g.result === 'Loss').length;
    
    csv += `${u.id},${u.name},${u.mobile},${u.balance||0},${u.withdrawableBalance||0},${u.bonusBalance||0},${u.isBlocked?'Yes':'No'},${u.deviceId||'N/A'},${u.referralCode||'N/A'},${u.referralEarnings||0},${totalGames},${wins},${losses},${totalDep},${totalWd},${u.hasDepositedAfter250?'Yes':'No'},${u.createdAt?new Date(u.createdAt).toLocaleDateString():'N/A'}\n`;
  });
  
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'royal_casino_users_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  URL.revokeObjectURL(url);
  showToast('📊 डेटा एक्सपोर्ट हो गया!', 'success');
}
